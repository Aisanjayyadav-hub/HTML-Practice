<!doctype html>
<!-- TOPIC 15: PSEUDO-CLASSES, PSEUDO-ELEMENTS, TRANSITIONS + MINI PROJECT
     THEORY:
     Pseudo-classes describe a state, such as :hover, :focus-visible, or :first-child.
     Pseudo-elements style a part of an element, such as ::before and ::after.
     Transitions animate property changes between states; keep motion subtle and accessible.
     This final project combines semantic HTML, forms/links, typography, box model, Flexbox,
     Grid-style responsiveness, focus states, and visual polish. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Card — Final Project</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, Arial, sans-serif;
      line-height: 1.6;
      color: #172033;
      background: linear-gradient(135deg, #eaf2ff, #f8f4ff);
    }

    /* EXAMPLE 1: Card layout, sizing, and shadow */
    .profile-card {
      width: min(100%, 390px);
      padding: 28px;
      border: 1px solid #d7deec;
      border-radius: 22px;
      background: white;
      box-shadow: 0 18px 50px rgb(26 45 90 / 12%);
      text-align: center;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    /* EXAMPLE 2: Pseudo-class and keyboard focus */
    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 60px rgb(26 45 90 / 18%);
    }
    a:focus-visible, button:focus-visible {
      outline: 3px solid #ed9c2b;
      outline-offset: 4px;
    }
    .tag:first-child { background: #e8efff; }

    /* EXAMPLE 3: Pseudo-element decorative line */
    .name::after {
      content: "";
      display: block;
      width: 54px;
      height: 4px;
      margin: 10px auto;
      border-radius: 99px;
      background: #5475d9;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #dfe8ff;
      font-size: 2.4rem;
    }
    .tags { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    .tag { padding: 5px 10px; border-radius: 99px; background: #f0f2f6; font-size: 0.85rem; }
    .button {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      color: white;
      background: #294fbd;
      text-decoration: none;
      transition: background 180ms ease;
    }
    .button:hover { background: #1c398d; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <article class="profile-card">
      <div class="avatar" aria-hidden="true">👨‍💻</div>
      <p class="tag">Student Developer</p>
      <h1 class="name">Your Name</h1>
      <p>Learning to build useful, accessible, and responsive websites one project at a time.</p>
      <div class="tags" aria-label="Skills">
        <span class="tag">HTML</span>
        <span class="tag">CSS</span>
        <span class="tag">Problem Solving</span>
      </div>
      <a class="button" href="mailto:student@example.com">Contact me</a>
    </article>
  </main>
</body>
</html>
